<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You’re in — Team Bulldogs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/gate.js"></script>
    <link rel="icon" href="assets/logo.png" type="image/png" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <header class="site-header">
      <div class="wrap nav">
        <a class="logo" href="index.html"><img class="logo__type" src="assets/type-orange.png" alt="Bulldogs" /></a>
        <nav class="nav__links"><a href="events.html">Events</a><a href="shop.html">Shop</a></nav>
        <div class="nav__actions"></div>
      </div>
    </header>
    <main>
      <header class="page-hero">
        <div class="wrap" data-confirm>
          <p class="eyebrow">Done</p>
          <h1 data-confirm-title>You’re booked</h1>
          <p class="muted" data-confirm-ref></p>
          <p data-confirm-copy>Check your email for the confirmation.</p>
          <p data-confirm-acts>
            <a class="btn btn--accent" data-ticket-link hidden href="ticket.html">View tickets</a>
            <a class="btn btn--ghost" data-orders-link hidden href="orders.html">Your orders</a>
            <button class="btn btn--ghost" type="button" data-open-auth="signup" data-confirm-signup hidden>Create an account</button>
            <a class="btn btn--ghost" data-confirm-back href="events.html">Back to events</a>
          </p>
        </div>
      </header>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-ui.js"></script>
    <script>
      (() => {
        const query = new URLSearchParams(location.search);
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const param = (key) => query.get(key) || hash.get(key);
        const type = param("type");
        const ref = param("ref");
        const token = param("c") || param("t");
        const isOrder = type === "order" || param("order") === "success";
        const isEvent = !isOrder && (type === "event" || param("booking") === "success" || Boolean(token));

        const title = document.querySelector("[data-confirm-title]");
        const line = document.querySelector("[data-confirm-ref]");
        const copy = document.querySelector("[data-confirm-copy]");
        const ticket = document.querySelector("[data-ticket-link]");
        const orders = document.querySelector("[data-orders-link]");
        const signup = document.querySelector("[data-confirm-signup]");
        const back = document.querySelector("[data-confirm-back]");

        const orderCopy = (guest) =>
          guest
            ? "Check your email for the confirmation. Create an account if you want orders in one place next time. In-stock tees ship from what we have. A new print is typically 2–3 weeks."
            : "Check your email for the confirmation. In-stock tees ship from what we have. A new print is typically 2–3 weeks.";
        const eventCopy = (guest) =>
          guest
            ? "Check your email for the confirmation and your ticket. Create an account if you want tickets in one place next time."
            : "Check your email for the confirmation and your ticket.";

        if (isOrder) {
          document.title = "Order received — Team Bulldogs";
          if (title) title.textContent = "Order received";
          if (back) {
            back.href = "shop.html";
            back.textContent = "Back to shop";
          }
          const clearBag = () => {
            try {
              localStorage.removeItem("bulldogs-cart");
              sessionStorage.setItem("bulldogs-cart-cleared", "1");
            } catch {
              /* ignore */
            }
            if (window.BULLDOGS_SESSION && window.BULLDOGS_API) {
              window.BULLDOGS_API.fn("me-api", { action: "save_cart", items: [] }).catch(() => {});
            }
          };
          clearBag();
          let clearTries = 0;
          const clearWait = setInterval(() => {
            clearTries += 1;
            if (window.BULLDOGS_SESSION && window.BULLDOGS_API) {
              clearBag();
              clearInterval(clearWait);
            } else if (clearTries > 25) {
              clearInterval(clearWait);
            }
          }, 120);
        } else if (isEvent) {
          document.title = "You’re booked — Team Bulldogs";
          if (title) title.textContent = "You’re booked";
          if (back) {
            back.href = "events.html";
            back.textContent = "Back to events";
          }
        }

        if (ref && line) line.textContent = `Reference ${ref}`;

        if (token && ticket) {
          ticket.hidden = false;
          const code = encodeURIComponent(token);
          ticket.href = `ticket.html?c=${code}#c=${code}`;
        }

        const paintAuth = () => {
          const signedIn = Boolean(window.BULLDOGS_SESSION);
          if (signup) signup.hidden = signedIn;
          if (orders) orders.hidden = !(isOrder && signedIn);
          if (!copy) return;
          if (isOrder) copy.textContent = orderCopy(!signedIn);
          else if (isEvent) copy.textContent = eventCopy(!signedIn);
          else copy.textContent = "Check your email for the confirmation.";
        };

        paintAuth();
        let tries = 0;
        const wait = setInterval(() => {
          tries += 1;
          paintAuth();
          if (window.BULLDOGS_SESSION !== undefined || tries > 25) clearInterval(wait);
        }, 120);
      })();
    </script>
  </body>
</html>
